<!doctype html>
<html lang="en" class="app-loader-active">

<head>
  <meta charset="UTF-8" />
  <!-- Google Analytics (G-HZ6PE1Q290) loads only after cookie consent -->
  <link rel="icon" type="image/webp" href="/Cachelogo.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Home hero: full-bleed bg + four pillars first (same-origin, high priority) -->
  <link rel="preload" href="/hero-grid-background.png" as="image" fetchpriority="high" />
  <link rel="preload" href="/images/Cloudback.webp" as="image" fetchpriority="high" />
  <link rel="preload" href="/images/GenAIback.webp" as="image" fetchpriority="high" />
  <link rel="preload" href="/images/CyberSecback.webp" as="image" fetchpriority="high" />
  <link rel="preload" href="/images/Infraback.webp" as="image" fetchpriority="high" />
  <link rel="preload" href="/navbar-logo.svg" as="image" />
  <link rel="preload" href="/images/innovations-meeting.webp" as="image" fetchpriority="low" />
  <!-- <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet"> -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <!-- DotLottie WC for Lottie animations (used by chatbot icon) -->
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.1/dist/dotlottie-wc.js" type="module"></script>
  <title>Cache Digitech</title>
  <style>
    html.app-loader-active {
      overflow: hidden;
      scrollbar-gutter: stable;
    }

    html.app-loader-active body {
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      overflow: hidden;
      pointer-events: auto
    }

    #app-loader.app-loader--exit {
      pointer-events: none
    }

    .page-loader {
      position: absolute;
      inset: 0;
      display: flex;
      background: #000;
      overflow: clip;
      transition: background-color .6s cubic-bezier(.44, 0, .56, 1) .6s
    }

    #app-loader.app-loader--exit .page-loader {
      background-color: transparent
    }

    .page-loader__main {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%
    }

    .page-loader__frame {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      display: flex
    }

    .page-loader__frame--top {
      top: 0
    }

    .page-loader__frame--bottom {
      bottom: 0
    }

    .page-loader__panel {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      transition: transform .6s cubic-bezier(.44, 0, .56, 1) .6s;
      will-change: transform
    }

    .page-loader__panel--top {
      align-items: flex-end;
      padding-bottom: 2px
    }

    .page-loader__panel--bottom {
      align-items: flex-start;
      padding-top: 2px
    }

    .page-loader__heading,
    .page-loader__subtitle {
      position: relative;
      margin: 0;
      white-space: nowrap;
      text-align: center;
      font-family: Outfit, Inter, system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: page-loader-text-in .6s cubic-bezier(.44, 0, .56, 1) .4s forwards
    }

    .page-loader__heading {
      font-size: clamp(1.5rem, 5.5vw, 2.5rem);
      transform: translateY(5px)
    }

    .page-loader__subtitle {
      font-size: clamp(1rem, 3.5vw, 1.375rem);
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: none;
      transform: translateY(-5px)
    }

    @keyframes page-loader-text-in {
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    #app-loader.app-loader--exit .page-loader__panel--top {
      transform: translateY(calc(-100% - 50px))
    }

    #app-loader.app-loader--exit .page-loader__panel--bottom {
      transform: translateY(calc(100% + 50px))
    }
  </style>
</head>

<body>
  <div id="app-loader" aria-hidden="false">
    <div class="page-loader">
      <div class="page-loader__main">
        <div class="page-loader__frame page-loader__frame--top">
          <div class="page-loader__panel page-loader__panel--top">
            <p class="page-loader__heading">CACHE DIGITECH</p>
          </div>
        </div>
        <div class="page-loader__frame page-loader__frame--bottom">
          <div class="page-loader__panel page-loader__panel--bottom">
            <p class="page-loader__subtitle">ENDEAVOURING PERFECTION</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      if (window.location.protocol === 'file:') {
        document.body.innerHTML = [
          '<div style="font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0b; color: #fff; padding: 24px; box-sizing: border-box;">',
          '<div style="text-align: center; max-width: 420px;">',
          '<h1 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 12px;">Cannot open directly from file</h1>',
          '<p style="color: #a1a1aa; margin-bottom: 20px; line-height: 1.5;">This app uses ES modules. Browsers block them when the page is opened from a file (file://). Serve the <code style="background: #27272a; padding: 2px 6px; border-radius: 4px;">dist</code> folder with a local server.</p>',
          '<p style="color: #a1a1aa; margin-bottom: 16px; font-size: 0.9rem;">From the <code style="background: #27272a; padding: 2px 6px; border-radius: 4px;">frontend</code> folder run:</p>',
          '<pre style="background: #27272a; padding: 12px 16px; border-radius: 8px; text-align: left; overflow-x: auto; font-size: 0.85rem;">npm run preview</pre>',
          '<p style="color: #71717a; margin-top: 16px; font-size: 0.8rem;">Then open the URL shown (e.g. http://localhost:4173)</p>',
          '</div></div>'
        ].join('');
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
